<style>

.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f2a50,#1565c0)}
.lb{background:#fff;border-radius:22px;padding:28px;width:100%;max-width:380px}.lb h2{font:700 22px Poppins;text-align:center;margin-bottom:6px}.lb p{text-align:center;color:var(--mu);font-size:14px;margin-bottom:10px}

input:focus,select:focus,textarea:focus{border-color:var(--p)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:12px;text-transform:uppercase}
.btn{border:0;border-radius:11px;padding:11px 18px;background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff;font:700 14px 'Hind Siliguri';cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.full{width:100%;justify-content:center;margin-top:18px;padding:13px}.btn.g{background:var(--ok)}.btn.r{background:var(--er)}.btn.gr{background:#64748b}.btn.s{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5}
aside{position:fixed;top:0;left:0;bottom:0;width:230px;background:#0f2a50;color:#fff;padding:18px 12px;overflow:auto;z-index:20;transition:.25s}
aside h1{font:700 18px Poppins;padding:6px 10px 18px;display:flex;gap:9px;align-items:center}

.mo>div{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:18px;right:18px;background:#14233b;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;transform:translateX(130%);transition:.3s;font-weight:600}.toast.show{transform:none}.toast.ok{background:#15803d}.toast.er{background:#b91c1c}

<script type="module">
/* ============ 🔧 index.html এর সাথে একই Firebase কনফিগ বসান ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAR8SaD21V3i5OMPP44KWejhlUHG5__QSA",
  authDomain: "leaf-smm-bd.firebaseapp.com",
  databaseURL: "https://leaf-smm-bd-default-rtdb.firebaseio.com",
  projectId: "leaf-smm-bd",
  storageBucket: "leaf-smm-bd.firebasestorage.app",
  messagingSenderId: "815648491674",
  appId: "1:815648491674:web:817ad958496f39c12f7723",
  measurementId: "G-YKGNLGJEHL"
};
/* ====================================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signInWithCustomToken,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+(+n||0).toFixed(2);
const fd=t=>t?.toDate?t.toDate().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'...';
const ts=o=>(o.createdAt?.seconds||9e9);
const fx=o=>{if(Array.isArray(o))return o.map(fx);if(o&&typeof o=='object'){if('__ts' in o){const s=o.__ts;return{seconds:s,toDate:()=>new Date(s*1000)}}const r={};for(const k in o)r[k]=fx(o[k]);return r}return o};
const inc=n=>({$inc:n});
function toast(m,t=''){const e=$('#toast');e.textContent=m;e.className='toast show '+t;clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',3000)}
const S={st:{},users:[],orders:[],deps:[],svcs:[],tix:[],reqs:[],prov:[],rb:[],rbStale:true,set:{},f:{o:'all',d:'pending',t:'open',uq:'',oq:''},unsub:[]};
const OST=['pending','processing','completed','partial','canceled'];

/* LOGIN / FIRST SETUP */
let setupMode=false,settingUp=false;
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch{return''}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
function applyMode(){
  const saved=lsGet('adminEmail');
  $('#lT').textContent=setupMode?'🛠 প্রথম সেটআপ':'🔐 Admin Login';
  $('#lS').textContent=setupMode?'আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড সেট করুন (একবারই)':'শুধুমাত্র অ্যাডমিনদের জন্য';
  $('#emBox').classList.toggle('hide',!(setupMode||!saved));
  $('#pw2').classList.toggle('hide',!setupMode);
  $('#fg').classList.toggle('hide',setupMode);
  $('#lB').textContent=setupMode?'অ্যাডমিন তৈরি করুন':'লগইন';
}
async function chk(){try{const j=await srv('/adm/state',null,true);setupMode=!!j.setup}catch{setupMode=false}applyMode()}
async function doLogin(){
  const pw=$('#lP').value,em=($('#lE').value.trim()||lsGet('adminEmail')),b=$('#lB');
  if(!em)return toast('ইমেইল দিন','er');if(pw.length<6)return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','er');
  b.disabled=true;
  if(setupMode){
    if(pw!==$('#lP2').value){b.disabled=false;return toast('দুই পাসওয়ার্ড মেলেনি','er')}
    settingUp=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      const sj=await srv('/adm/setup',{});if(sj.error)throw new Error(sj.error);
      lsSet('adminEmail',em);settingUp=false;setupMode=false;await enter(c.user);toast('অ্যাডমিন তৈরি হয়েছে','ok');
    }catch(e){settingUp=false;toast(e.code=='auth/email-already-in-use'?'এই ইমেইল আগে ব্যবহার হয়েছে, অন্য ইমেইল দিন':'সেটআপ ব্যর্থ: '+e.message,'er')}
  }else{
    try{await signInWithEmailAndPassword(auth,em,pw);lsSet('adminEmail',em)}catch{toast('ইমেইল বা পাসওয়ার্ড ভুল','er')}
  }
  b.disabled=false;
}
$('#lB').onclick=doLogin;$('#lP').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});
$('#fg').onclick=async()=>{
  $('#emBox').classList.remove('hide');const em=$('#lE').value.trim()||lsGet('adminEmail');
  if(!em)return toast('উপরে আপনার অ্যাডমিন ইমেইল লিখে আবার চাপুন','er');
  try{await sendPasswordResetEmail(auth,em);toast('রিসেট লিংক ইমেইলে পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)','ok')}catch{toast('রিসেট পাঠানো যায়নি, ইমেইল ঠিক আছে কি দেখুন','er')}
};
$('#out').onclick=()=>signOut(auth);
async function enter(u){
  let me=null;try{me=await srv('/adm/me',{})}catch{}
  if(!me||me.error){toast(me&&me.error?me.error:'এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই','er');await signOut(auth);return}
  S.set=fx(me.settings||{});
  $('#login').classList.add('hide');$('#panel').classList.remove('hide');
  refresh();clearInterval(S._pt);S._pt=setInterval(()=>{if(!document.hidden)refresh()},10000);
}
const NEED={dash:['orders'],orders:['orders'],deps:['deposits'],users:['users'],svcs:['services'],prov:['providers'],reqs:['requests'],tix:['tickets'],rb:[],tools:[],set:[]};
const KEY={orders:'orders',deposits:'deps',users:'users',services:'svcs',tickets:'tix',requests:'reqs',providers:'prov'};
async function load(c){
  const b={c};
  if(c=='orders'){if(cur=='dash')b.limit=10;else{b.status=S.f.o;b.q=S.f.oq}}
  if(c=='deposits')b.status=S.f.d;
  if(c=='users')b.q=S.f.uq;
  if(c=='tickets')b.status=S.f.t;
  const r=await srv('/adm/list',b);if(r.error)throw new Error(r.error);
  S[KEY[c]]=fx(r.items||[]);
}
let _rf=0;
async function refresh(){
  const id=++_rf;
  try{
    const [st,sm]=await Promise.all([srv('/adm/stats',{}),cur=='set'||cur=='rb'||!S.set.siteName?srv('/adm/me',{}):null]);
    if(st&&!st.error)S.st=st;
    if(sm&&!sm.error&&!(cur=='set'&&S._setDirty))S.set=fx(sm.settings||{});
    if(cur=='dash'&&Date.now()-(S._usT||0)>45000){S._usT=Date.now();srv('/adm/usage',{}).then(u=>{if(u&&!u.error){S.us=u;if(cur=='dash')render()}}).catch(()=>{})}
    await Promise.all([...(NEED[cur]||[]),...(cur!='svcs'&&!S.svcs.length?['services']:[]),...(cur=='prov'||cur=='svcs'?['providers']:[])].filter((v,i,a)=>a.indexOf(v)==i).map(load));
  }catch(e){console.warn(e)}
  if(id==_rf&&!(cur=='set'&&document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName)))render();
  else if(id==_rf)badges();
}
let tgTried=false;
async function tgLogin(){
  const W=window.Telegram?.WebApp;if(!W||!W.initData)return false;
  try{
    const base=await botServer();if(!base)return false;
    const r=await fetch(base+'/adm/tg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:W.initData})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.token){if(j.error)toast(j.error,'er');return false}
    await signInWithCustomToken(auth,j.token);return true;
  }catch{return false}
}
onAuthStateChanged(auth,async u=>{
  if(settingUp)return;
  S.unsub.forEach(f=>f());S.unsub=[];clearInterval(S._pt);
  if(!u&&!tgTried&&window.Telegram?.WebApp?.initData){tgTried=true;if(await tgLogin())return}
  if(!u){$('#panel').classList.add('hide');$('#login').classList.remove('hide');chk();return}
  await enter(u);
});

/* NAV */
let cur='dash';
$$('aside a[data-v]').forEach(a=>a.onclick=()=>{cur=a.dataset.v;$$('aside a').forEach(x=>x.classList.toggle('on',x==a));$$('section').forEach(s=>s.classList.add('hide'));$('#v-'+cur).classList.remove('hide');$('#side').classList.remove('open');if(cur=='rb')S.rbStale=true;if(cur=='tools')S._tl=false;S._setDirty=false;render();refresh()});
$('#mm').onclick=()=>$('#side').classList.toggle('open');
function badge(id,n){const e=$(id);e.textContent=n;e.classList.toggle('hide',!n)}
function badges(){const t=S.st||{};badge('#cO',t.pending||0);badge('#cD',t.pdeps||0);badge('#cR',t.reqs||0);badge('#cT',t.tix||0)}
function render(){
  $('#brand').textContent=S.set.siteName||'Admin';
  badges();
  ({dash:rDash,orders:rOrd,deps:rDep,users:rUsr,svcs:rSvc,prov:rProv,rb:rRb,reqs:rReq,tix:rTix,tools:rTools,set:rSet})[cur]();
}
const mopen=h=>{$('#mc').innerHTML=h;$('#mo').classList.remove('hide')},mclose=()=>$('#mo').classList.add('hide');
$('#mo').onclick=e=>{if(e.target.id=='mo')mclose()};
const sel=(opts,v)=>opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('');
const confirmDo=async(msg,fn)=>{if(!confirm(msg))return;try{await fn();toast('সম্পন্ন','ok')}catch(e){toast(e.message,'er')}};

/* DASHBOARD */
function usageCard(){
  const u=S.us;if(!u)return `<div class="card"><h2 class="t" style="font-size:16px">💾 ডাটাবেস স্টোরেজ</h2><div class="empty" style="padding:14px">হিসাব হচ্ছে...</div></div>`;
  const col=u.pct>=80?'#dc2626':u.pct>=60?'#f59e0b':'#16a34a';
  const left=u.daysLeft==null?'নতুন ডাটা খুব কম বাড়ছে':`${u.daysLeft} দিন (প্রায় ${new Date(Date.now()+u.daysLeft*864e5).toLocaleDateString('bn-BD',{day:'numeric',month:'long',year:'numeric'})})`;
  return `<div class="card"><h2 class="t" style="font-size:16px">💾 ডাটাবেস স্টোরেজ<span style="font-size:13px;color:${col}">${u.pct}% ব্যবহার</span></h2>

/* বট সার্ভারের সাথে যোগাযোগ — সব ডাটা এখান থেকেই আসে/যায় */
const BOT_SERVER='';
async function botServer(){
  if(BOT_SERVER)return BOT_SERVER.replace(/\/$/,'');
  let c=lsGet('leafBS');
  if(!c){try{const r=await fetch('https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+'/databases/(default)/documents/public/config?key='+firebaseConfig.apiKey),j=await r.json();c=j.fields?.botServer?.stringValue||'';if(c)lsSet('leafBS',c)}catch{}}
  return c.replace(/\/$/,'');
}
async function srv(path,body,anon){
  const base=await botServer();
  if(!base)throw new Error('বট সার্ভারের ঠিকানা পাওয়া যায়নি');
  const h={'Content-Type':'application/json'};
  if(!anon){const tok=await auth.currentUser.getIdToken();h.Authorization='Bearer '+tok}
  const r=await fetch(base+path,{method:anon?'GET':'POST',headers:h,body:anon?undefined:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>({error:'সার্ভারের উত্তর বোঝা যায়নি'}));
  if(!r.ok&&!j.error)j.error='ত্রুটি '+r.status;
  return j;
}
async function dbw(op,c,id,data,merge){const r=await srv('/adm/doc',{op,c,id,data,merge});if(r.error)throw new Error(r.error);refresh();return r}

  $$('[data-rt]').forEach(x=>x.onclick=()=>{const b=l.find(y=>y.id==x.dataset.rt);confirmDo((b.active?'বন্ধ':'চালু')+' করবেন?',()=>upd(b.id,{active:!b.active}))});
  $$('[data-rc]').forEach(x=>x.onclick=()=>{const b=l.find(y=>y.id==x.dataset.rc);mopen(`<h2 class="t">@${esc(b.username)} — অর্ডার চ্যানেল</h2><label>@নাম বা -100… আইডি</label><input id="oc" value="${esc(b.orderChannel||'')}"><button class="btn full" id="ocs">সেভ</button>`);$('#ocs').onclick=()=>upd(b.id,{orderChannel:$('#oc').value.trim()})});
  $$('[data-rf]').forEach(x=>x.onclick=()=>{const b=l.find(y=>y.id==x.dataset.rf);mopen(`<h2 class="t">@${esc(b.username)} — ফোর্স জয়েন চ্যানেল</h2><label>প্রতি লাইনে একটি (@নাম অথবা -100…|https://t.me/+লিংক)</label><textarea id="fc" rows="4">${esc((b.forceChannels||[]).join('\n'))}</textarea><button class="btn full" id="fcs">সেভ</button>`);$('#fcs').onclick=()=>upd(b.id,{forceChannels:$('#fc').value.split('\n').map(y=>y.trim()).filter(Boolean)})});
  $$('[data-rbc]').forEach(x=>x.onclick=()=>{const b=l.find(y=>y.id==x.dataset.rbc);mopen(`<h2 class="t">📢 @${esc(b.username)} এর ইউজারদের মেসেজ</h2><label>মেসেজ</label><textarea id="bm" rows="4"></textarea><button class="btn full" id="bs2">পাঠান</button>`);$('#bs2').onclick=()=>bc(b.id,$('#bm').value)});
}

/* TICKETS */
const canned=()=>String(S.set.cannedReplies||'').split('\n').map(x=>x.trim()).filter(Boolean);
function rTix(){
  const l=S.tix.filter(t=>S.f.t=='all'||t.status==S.f.t).sort((a,b)=>ts(b)-ts(a));
  $('#v-tix').innerHTML=`<h2 class="t">সাপোর্ট টিকেট</h2><div class="bar"><select id="tf">${['open','closed','all'].map(s=>`<option ${S.f.t==s?'selected':''}>${s}</option>`).join('')}</select></div>
  ${l.map(t=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${esc(t.subject)} <small style="color:var(--mu)">— ${esc(t.userName)} • ${fd(t.createdAt)}</small></b><span class="st ${t.status}">${t.status}</span></div><p style="margin:10px 0">${esc(t.message)}</p>
  ${canned().length?`<select data-cn="${t._id}" style="margin-bottom:8px"><option value="">⚡ রেডিমেড উত্তর বেছে নিন</option>${canned().map((c,i)=>`<option value="${i}">${esc(c.slice(0,60))}</option>`).join('')}</select>`:''}<textarea rows="2" id="r-${t._id}" placeholder="উত্তর লিখুন...">${esc(t.reply||'')}</textarea><div style="margin-top:10px;display:flex;gap:8px"><button class="btn s" data-rp="${t._id}">উত্তর দিয়ে বন্ধ করুন</button></div></div>`).join('')||'<div class="empty">কোনো টিকেট নেই</div>'}`;
  $('#tf').onchange=e=>{S.f.t=e.target.value;rTix();refresh()};
  $$('[data-cn]').forEach(x=>x.onchange=()=>{if(x.value!=='')$('#r-'+x.dataset.cn).value=canned()[+x.value]});
  $$('[data-rp]').forEach(b=>b.onclick=()=>{const r=$('#r-'+b.dataset.rp).value.trim();if(!r)return toast('উত্তর লিখুন','er');dbw('update','tickets',b.dataset.rp,{reply:r,status:'closed'}).then(()=>toast('পাঠানো হয়েছে','ok')).catch(e=>toast(e.message,'er'))});
}

/* SETTINGS */
function rSet(){
  const s=S.set,m=s.methods||[];
  $('#v-set').innerHTML=`<h2 class="t">সাইট সেটিংস</h2><div class="card"><div class="fg"><div><label>সাইটের নাম</label><input id="s1" value="${esc(s.siteName||'')}"></div><div><label>সাপোর্ট লিংক (Telegram/WhatsApp)</label><input id="s2" value="${esc(s.supportLink||'')}"></div>
  <div><label>ন্যূনতম ডিপোজিট (৳)</label><input id="s3" type="number" value="${s.minDeposit||10}"></div><div><label>রেফার কমিশন (%)</label><input id="s4" type="number" step="0.1" value="${s.refPercent||0}"></div>
  <div><label>প্রতি অর্ডারে XP (ফিক্সড)</label><input id="x1" type="number" value="${s.xpPerOrder||0}"></div>
  <div><label>প্রতি ৳১ খরচে XP</label><input id="x2" type="number" step="0.1" value="${s.xpPerTaka||0}"></div>
  <div><label>কত XP = ৳১</label><input id="x3" type="number" value="${s.xpPerBdt||0}"></div>
  <div><label>ন্যূনতম XP কনভার্ট</label><input id="x4" type="number" value="${s.minXpConvert||0}"></div>
  <div><label>টিউটোরিয়াল ভিডিও লিংক</label><input id="x5" value="${esc(s.tutorialLink||'')}"></div></div>
  <h2 class="t" style="font-size:16px;margin-top:22px">🤖 টেলিগ্রাম বট সেটিংস</h2><div class="fg">
  <div><label>অ্যাডমিন টেলিগ্রাম আইডি (কমা দিয়ে)</label><input id="b1" value="${esc((s.adminIds||[]).join(', '))}" placeholder="123456789, 987654321"></div>
  <div><label>অর্ডার চ্যানেল (@নাম বা -100…)</label><input id="b3" value="${esc(s.orderChannel||'')}"></div>
  <div><label>অর্ডার পোস্টের বাটন লিংক</label><input id="b4" value="${esc(s.orderBtnLink||'')}" placeholder="https://t.me/yourbot"></div>
  <div><label>রিসেলার বট চার্জ (৳)</label><input id="b5" type="number" step="0.01" value="${s.resellerBotCharge||0}"></div></div>
  <label>ফোর্স জয়েন চ্যানেল (প্রতি লাইনে একটি: @নাম অথবা -100…|https://t.me/+লিংক)</label><textarea id="b2" rows="3">${esc((s.forceChannels||[]).join('\n'))}</textarea>
  <p style="color:var(--mu);font-size:12px;margin-top:6px">ছবি (অর্ডার/রিসেলার/XP) বটের অ্যাডমিন মেনু থেকে সেট করুন।</p>
  <label>নোটিশ (হোমে দেখাবে, খালি রাখলে লুকাবে)</label><textarea id="s5" rows="2">${esc(s.notice||'')}</textarea>
  <label>ব্যানার ইমেজ লিংক (প্রতি লাইনে একটি, খালি রাখলে ডিফল্ট)</label><textarea id="s6" rows="3">${esc((s.banners||[]).join('\n'))}</textarea>
  <label>ভিআইপি লেভেল (প্রতি লাইনে: নাম,ন্যূনতম খরচ,ডিসকাউন্ট%)</label><textarea id="s7" rows="5">${(s.levels||[{name:'Starter',min:0,disc:0},{name:'Bronze',min:500,disc:2},{name:'Silver',min:2000,disc:4},{name:'Gold',min:5000,disc:6},{name:'Diamond',min:15000,disc:10}]).map(l=>[l.name,l.min,l.disc].join(',')).join('\n')}</textarea>
  <label>পেমেন্ট মেথড</label><div id="pmL">${m.map((x,i)=>pmRow(x)).join('')}</div>
  <button class="btn gr s" id="pmA" style="margin-top:10px"><i class="fa-solid fa-plus"></i> মেথড যোগ</button><br><button class="btn full" id="ss">সেভ করুন</button></div>
  <div class="card"><h2 class="t" style="font-size:17px">💲 রেট সেট করার নিয়ম (মূল বট)</h2>
  <p style="color:var(--mu);font-size:13px;line-height:1.7;margin-bottom:8px">প্রতি লাইনে একটি নিয়ম, রেট প্রতি ১০০০ এর জন্য। যেমন <b>0-3 = 12</b> লিখলে যেসব সার্ভিসের মূল রেট ০ থেকে ৩ টাকার মধ্যে সবগুলোর রেট ১২ টাকা হবে। <b>50+ = 100</b> মানে ৫০ বা তার বেশি হলে ১০০। কোনো নিয়মে না পড়লে রেট আগের মতোই থাকে। একাধিক নিয়ম মিললে ওপরেরটা চলে। লেখা খালি রেখে প্রয়োগ করলে সব রেট মূলে ফিরে যাবে।</p>
  <textarea id="rr" rows="6" placeholder="0-3 = 12&#10;3.01-10 = 25&#10;50+ = 100">${esc(s.rateRules||'')}</textarea>
  <div style="display:flex;gap:8px;margin-top:10px"><button class="btn gr s" id="rrD"><i class="fa-regular fa-eye"></i> কতটা বদলাবে দেখুন</button><button class="btn s" id="rrA"><i class="fa-solid fa-check"></i> প্রয়োগ করুন</button></div></div>
  <div class="card"><h2 class="t" style="font-size:17px">🔑 অ্যাডমিন পাসওয়ার্ড পরিবর্তন</h2><div class="fg"><div><label>বর্তমান পাসওয়ার্ড</label><input id="cp0" type="password"></div><div><label>নতুন পাসওয়ার্ড</label><input id="cp1" type="password"></div><div><label>নতুন পাসওয়ার্ড আবার</label><input id="cp2" type="password"></div></div><button class="btn" id="cpB" style="margin-top:14px">পাসওয়ার্ড বদলান</button></div>`;
  $('#cpB').onclick=async()=>{const a=$('#cp0').value,b=$('#cp1').value;if(b.length<6)return toast('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','er');if(b!==$('#cp2').value)return toast('নতুন পাসওয়ার্ড দুইবার মেলেনি','er');
    try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,a));await updatePassword(u,b);$('#cp0').value=$('#cp1').value=$('#cp2').value='';toast('পাসওয়ার্ড বদলানো হয়েছে','ok')}catch{toast('বর্তমান পাসওয়ার্ড ভুল','er')}};
  const rr=async dry=>{try{const r=await srv('/adm/rates',{rules:$('#rr').value,dry});if(r.error)throw new Error(r.error);
    if(dry)toast(`মোট ${r.total} টি সার্ভিসের মধ্যে ${r.changed} টির রেট বদলাবে`,'ok');else{toast(`✅ ${r.changed} টি সার্ভিসের রেট বদলেছে`,'ok');refresh()}}catch(e){toast(e.message,'er')}};
  $('#rrD').onclick=()=>rr(true);
  $('#rrA').onclick=()=>{if(confirm('সব সার্ভিসে এই নিয়ম প্রয়োগ হবে। নিশ্চিত?'))rr(false)};
  $('#pmA').onclick=()=>$('#pmL').insertAdjacentHTML('beforeend',pmRow({}));
  $('#pmL').onclick=e=>{const b=e.target.closest('[data-rm]');if(b)b.parentElement.remove()};
  $('#ss').onclick=async()=>{
    const methods=$$('#pmL .pmr').map(r=>({name:r.children[0].value.trim(),number:r.children[1].value.trim(),note:r.children[2].value.trim()})).filter(x=>x.name&&x.number);
    try{await dbw('set','settings','main',{adminIds:$('#b1').value.split(/[\s,]+/).filter(x=>/^\d+$/.test(x)),forceChannels:$('#b2').value.split('\n').map(x=>x.trim()).filter(Boolean),orderChannel:$('#b3').value.trim(),orderBtnLink:$('#b4').value.trim(),resellerBotCharge:+$('#b5').value||0,siteName:$('#s1').value.trim(),supportLink:$('#s2').value.trim(),minDeposit:+$('#s3').value||10,refPercent:+$('#s4').value||0,xpPerOrder:+$('#x1').value||0,xpPerTaka:+$('#x2').value||0,xpPerBdt:+$('#x3').value||0,minXpConvert:+$('#x4').value||0,tutorialLink:$('#x5').value.trim(),levels:$('#s7').value.split('\n').map(x=>x.split(',').map(y=>y.trim())).filter(a=>a[0]&&!isNaN(+a[1])).map(a=>({name:a[0],min:+a[1],disc:+a[2]||0})).sort((a,b)=>a.min-b.min),notice:$('#s5').value.trim(),banners:$('#s6').value.split('\n').map(x=>x.trim()).filter(Boolean),methods},true);S._setDirty=false;toast('সেটিংস সেভ হয়েছে','ok')}catch(e){toast(e.message,'er')}};
}
const pmRow=x=>`<div class="pmr" style="display:flex;gap:8px;margin-top:8px"><input placeholder="নাম (bKash)" value="${esc(x.name||'')}"><input placeholder="নাম্বার" value="${esc(x.number||'')}"><input placeholder="নোট (Send Money)" value="${esc(x.note||'')}"><button class="btn r s" data-rm style="margin-top:5px"><i class="fa-solid fa-xmark"></i></button></div>`;
</script>
<div style="position:fixed;left:6px;bottom:2px;font:9px sans-serif;color:#94a3b8;z-index:1;pointer-events:none">v1101e</div></body>
