<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--p:#1e88e5;--p2:#1565c0;--bg:#f1f5fb;--tx:#14233b;--mu:#7a8aa3;--bd:#dbe6f3;--ok:#16a34a;--er:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hind Siliguri',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0f2a50,#1565c0)}
.lb{background:#fff;border-radius:22px;padding:28px;width:100%;max-width:380px}.lb h2{font:700 22px Poppins;text-align:center;margin-bottom:6px}.lb p{text-align:center;color:var(--mu);font-size:14px;margin-bottom:10px}
input,select,textarea{width:100%;border:1.5px solid var(--bd);border-radius:11px;padding:11px 13px;font:500 14px 'Hind Siliguri';background:#fafcff;outline:none;margin-top:5px}
input:focus,select:focus,textarea:focus{border-color:var(--p)}
label{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-top:12px;text-transform:uppercase}
.btn{border:0;border-radius:11px;padding:11px 18px;background:linear-gradient(135deg,#2196f3,#1565c0);color:#fff;font:700 14px 'Hind Siliguri';cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn.full{width:100%;justify-content:center;margin-top:18px;padding:13px}.btn.g{background:var(--ok)}.btn.r{background:var(--er)}.btn.gr{background:#64748b}.btn.s{padding:6px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5}
aside{position:fixed;top:0;left:0;bottom:0;width:230px;background:#0f2a50;color:#fff;padding:18px 12px;overflow:auto;z-index:20;transition:.25s}
aside h1{font:700 18px Poppins;padding:6px 10px 18px;display:flex;gap:9px;align-items:center}
aside a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;color:#b8c8e0;cursor:pointer;font-weight:600;font-size:15px;margin-bottom:3px}
aside a:hover{background:rgba(255,255,255,.08)}aside a.on{background:var(--p);color:#fff}
aside a b{margin-left:auto;background:#ef4444;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
main{margin-left:230px;padding:22px}
.mb{display:none;position:sticky;top:0;background:#0f2a50;color:#fff;padding:13px 16px;z-index:15;align-items:center;gap:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:18px}
h2.t{font:700 20px Poppins;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.sc{border-radius:16px;padding:16px;color:#fff}.sc small{font-weight:600;opacity:.95}.sc b{display:block;font:700 24px Poppins;margin-top:6px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;color:var(--mu);font-size:12px;text-transform:uppercase;padding:10px;border-bottom:2px solid var(--bd)}td{padding:10px;border-bottom:1px solid #edf2f9;vertical-align:middle}
.st{font:700 11px Poppins;color:#fff;border-radius:8px;padding:4px 9px;text-transform:uppercase}
.pending,.open{background:#f59e0b}.processing{background:#3b82f6}.completed,.approved,.closed,.done{background:#16a34a}.partial{background:#8b5cf6}.canceled,.rejected{background:#ef4444}
.bar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}.bar input,.bar select{margin:0;flex:1;min-width:140px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mo{position:fixed;inset:0;background:rgba(10,20,40,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mo>div{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:18px;right:18px;background:#14233b;color:#fff;padding:12px 18px;border-radius:12px;z-index:99;transform:translateX(130%);transition:.3s;font-weight:600}.toast.show{transform:none}.toast.ok{background:#15803d}.toast.er{background:#b91c1c}
.lnk{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;color:var(--p)}
.empty{text-align:center;color:var(--mu);padding:30px}
@media(max-width:820px){aside{transform:translateX(-100%)}aside.open{transform:none}main{margin-left:0;padding:14px}.mb{display:flex}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="login">
  <div class="lb"><h2 id="lT">🔐 Admin Login</h2><p id="lS">শুধুমাত্র অ্যাডমিনদের জন্য</p>
    <div id="emBox" class="hide"><label>ইমেইল</label><input id="lE" type="email" placeholder="আপনার ইমেইল (পাসওয়ার্ড রিসেটে লাগবে)"></div>
    <label id="pL">অ্যাডমিন পাসওয়ার্ড</label><input id="lP" type="password" placeholder="পাসওয়ার্ড দিন">
    <div id="pw2" class="hide"><label>পাসওয়ার্ড আবার দিন</label><input id="lP2" type="password" placeholder="আবার লিখুন"></div>
    <button class="btn full" id="lB">লগইন</button>
    <a id="fg" style="display:block;text-align:center;margin-top:14px;color:var(--p);cursor:pointer;font-size:14px;font-weight:600">পাসওয়ার্ড ভুলে গেছেন?</a></div>
</div>

<div id="panel" class="hide">
  <div class="mb"><i class="fa-solid fa-bars" id="mm" style="font-size:20px;cursor:pointer"></i><b>Admin Panel</b></div>
  <aside id="side">
    <h1><i class="fa-solid fa-shield-halved"></i><span id="brand">Admin</span></h1>
    <a data-v="dash" class="on"><i class="fa-solid fa-chart-pie"></i>ড্যাশবোর্ড</a>
    <a data-v="orders"><i class="fa-solid fa-file-lines"></i>অর্ডার<b id="cO" class="hide"></b></a>
    <a data-v="deps"><i class="fa-solid fa-money-bill-transfer"></i>ডিপোজিট<b id="cD" class="hide"></b></a>
    <a data-v="users"><i class="fa-solid fa-users"></i>ইউজার</a>
    <a data-v="svcs"><i class="fa-solid fa-layer-group"></i>সার্ভিস</a>
    <a data-v="prov"><i class="fa-solid fa-plug"></i>প্রোভাইডার API</a>
    <a data-v="reqs"><i class="fa-solid fa-life-ring"></i>রিকোয়েস্ট<b id="cR" class="hide"></b></a>
    <a data-v="tix"><i class="fa-solid fa-ticket"></i>টিকেট<b id="cT" class="hide"></b></a>
    <a data-v="set"><i class="fa-solid fa-gear"></i>সেটিংস</a>
    <a id="out" style="margin-top:20px"><i class="fa-solid fa-right-from-bracket"></i>লগআউট</a>
  </aside>
  <main>
    <section id="v-dash"></section>
    <section id="v-orders" class="hide"></section>
    <section id="v-deps" class="hide"></section>
    <section id="v-users" class="hide"></section>
    <section id="v-svcs" class="hide"></section>
    <section id="v-prov" class="hide"></section>
    <section id="v-reqs" class="hide"></section>
    <section id="v-tix" class="hide"></section>
    <section id="v-set" class="hide"></section>
  </main>
</div>
<div class="mo hide" id="mo"><div id="mc"></div></div>

<script type="module">
/* ============ 🔧 index.html এর সাথে একই Firebase কনফিগ বসান ============ */
const firebaseConfig = {
  apiKey: "AIzaSyAR8SaD21V3i5OMPP44KWejhlUHG5__QSA",
  authDomain: "leaf-smm-bd.firebaseapp.com",
  databaseURL: "https://leaf-smm-bd-default-rtdb.firebaseio.com",
  projectId: "leaf-smm-bd",
  storageBucket: "leaf-smm-bd.firebasestorage.app",
  messagingSenderId: "815648491674",
  appId: "1:815648491674:web:817ad958496f39c12f7723",
  measurementId: "G-YKGNLGJEHL"
};
/* ====================================================================== */
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,updatePassword,reauthenticateWithCredential,EmailAuthProvider,sendPasswordResetEmail,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,onSnapshot,collection,addDoc,runTransaction,serverTimestamp,increment,query,where,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tk=n=>'৳'+(+n||0).toFixed(2);
const fd=t=>t?.toDate?t.toDate().toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'...';
const ts=o=>(o.createdAt?.seconds||9e9);
function toast(m,t=''){const e=$('#toast');e.textContent=m;e.className='toast show '+t;clearTimeout(e._t);e._t=setTimeout(()=>e.className='toast',3000)}
const S={users:[],orders:[],deps:[],svcs:[],tix:[],reqs:[],provs:[],sel:new Set(),set:{},f:{o:'all',d:'pending',t:'open',uq:'',oq:''},unsub:[]};
const OST=['pending','processing','completed','partial','canceled'];

/* LOGIN / FIRST SETUP */
let setupMode=false,settingUp=false;
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch{return''}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
function applyMode(){
  const saved=lsGet('adminEmail');
  $('#lT').textContent=setupMode?'🛠 প্রথম সেটআপ':'🔐 Admin Login';
  $('#lS').textContent=setupMode?'আপনার অ্যাডমিন ইমেইল ও পাসওয়ার্ড সেট করুন (একবারই)':'শুধুমাত্র অ্যাডমিনদের জন্য';
  $('#emBox').classList.toggle('hide',!(setupMode||!saved));
  $('#pw2').classList.toggle('hide',!setupMode);
  $('#fg').classList.toggle('hide',setupMode);
  $('#lB').textContent=setupMode?'অ্যাডমিন তৈরি করুন':'লগইন';
}
async function chk(){try{setupMode=!(await getDoc(doc(db,'meta','lock'))).exists()}catch{setupMode=false}applyMode()}
async function doLogin(){
  const pw=$('#lP').value,em=($('#lE').value.trim()||lsGet('adminEmail')),b=$('#lB');
  if(!em)return toast('ইমেইল দিন','er');if(pw.length<6)return toast('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','er');
  b.disabled=true;
  if(setupMode){
    if(pw!==$('#lP2').value){b.disabled=false;return toast('দুই পাসওয়ার্ড মেলেনি','er')}
    settingUp=true;
    try{
      const c=await createUserWithEmailAndPassword(auth,em,pw);
      const w=writeBatch(db);
      w.set(doc(db,'admins',c.user.uid),{role:'admin',createdAt:serverTimestamp()});
      w.set(doc(db,'meta','lock'),{by:c.user.uid,createdAt:serverTimestamp()});
      await w.commit();lsSet('adminEmail',em);settingUp=false;setupMode=false;await enter(c.user);toast('অ্যাডমিন তৈরি হয়েছে','ok');
    }catch(e){settingUp=false;toast(e.code=='auth/email-already-in-use'?'এই ইমেইল আগে ব্যবহার হয়েছে, অন্য ইমেইল দিন':'সেটআপ ব্যর্থ: '+e.message,'er')}
  }else{
    try{await signInWithEmailAndPassword(auth,em,pw);lsSet('adminEmail',em)}catch{toast('ইমেইল বা পাসওয়ার্ড ভুল','er')}
  }
  b.disabled=false;
}
$('#lB').onclick=doLogin;$('#lP').addEventListener('keydown',e=>{if(e.key=='Enter')doLogin()});
$('#fg').onclick=async()=>{
  $('#emBox').classList.remove('hide');const em=$('#lE').value.trim()||lsGet('adminEmail');
  if(!em)return toast('উপরে আপনার অ্যাডমিন ইমেইল লিখে আবার চাপুন','er');
  try{await sendPasswordResetEmail(auth,em);toast('রিসেট লিংক ইমেইলে পাঠানো হয়েছে (স্প্যাম ফোল্ডারও দেখুন)','ok')}catch{toast('রিসেট পাঠানো যায়নি, ইমেইল ঠিক আছে কি দেখুন','er')}
};
$('#out').onclick=()=>signOut(auth);
async function enter(u){
  let ok=false;try{ok=(await getDoc(doc(db,'admins',u.uid))).exists()}catch{}
  if(!ok){toast('এই অ্যাকাউন্টের অ্যাডমিন অনুমতি নেই','er');await signOut(auth);return}
  $('#login').classList.add('hide');$('#panel').classList.remove('hide');
  const L=(c,k)=>S.unsub.push(onSnapshot(collection(db,c),s=>{S[k]=s.docs.map(d=>({_id:d.id,...d.data()}));render()},e=>console.warn(c,e.code)));
  L('users','users');L('orders','orders');L('deposits','deps');L('services','svcs');L('tickets','tix');L('requests','reqs');L('providers','provs');
  S.unsub.push(onSnapshot(doc(db,'settings','main'),s=>{S.set=s.data()||{};render()}));
}
onAuthStateChanged(auth,async u=>{
  if(settingUp)return;
  S.unsub.forEach(f=>f());S.unsub=[];
  if(!u){$('#panel').classList.add('hide');$('#login').classList.remove('hide');chk();return}
  await enter(u);
});

/* NAV */
let cur='dash';
$$('aside a[data-v]').forEach(a=>a.onclick=()=>{cur=a.dataset.v;$$('aside a').forEach(x=>x.classList.toggle('on',x==a));$$('section').forEach(s=>s.classList.add('hide'));$('#v-'+cur).classList.remove('hide');$('#side').classList.remove('open');render()});
$('#mm').onclick=()=>$('#side').classList.toggle('open');
function badge(id,n){const e=$(id);e.textContent=n;e.classList.toggle('hide',!n)}
function render(){
  $('#brand').textContent=S.set.siteName||'Admin';
  badge('#cO',S.orders.filter(o=>o.status=='pending').length);badge('#cD',S.deps.filter(o=>o.status=='pending').length);badge('#cR',S.reqs.filter(o=>o.status=='pending').length);badge('#cT',S.tix.filter(o=>o.status=='open').length);
  ({dash:rDash,orders:rOrd,deps:rDep,users:rUsr,svcs:rSvc,prov:rProv,reqs:rReq,tix:rTix,set:rSet})[cur]();
}
const mopen=h=>{$('#mc').innerHTML=h;$('#mo').classList.remove('hide')},mclose=()=>$('#mo').classList.add('hide');
$('#mo').onclick=e=>{if(e.target.id=='mo')mclose()};
const sel=(opts,v)=>opts.map(o=>`<option ${o==v?'selected':''}>${o}</option>`).join('');
const confirmDo=async(msg,fn)=>{if(!confirm(msg))return;try{await fn();toast('সম্পন্ন','ok')}catch(e){toast(e.message,'er')}};

/* DASHBOARD */
function rDash(){
  const t0=new Date();t0.setHours(0,0,0,0);const td=S.orders.filter(o=>o.createdAt?.toDate&&o.createdAt.toDate()>=t0);
  const ok=S.deps.filter(d=>d.status=='approved');
  const c=[['#1e88e5','fa-users','মোট ইউজার',S.users.length],['#7c3aed','fa-cart-shopping','মোট অর্ডার',S.orders.length],['#f59e0b','fa-hourglass-half','পেন্ডিং অর্ডার',S.orders.filter(o=>o.status=='pending').length],['#16a34a','fa-sack-dollar','মোট বিক্রি',tk(S.orders.filter(o=>o.status!='canceled').reduce((a,o)=>a+o.charge,0))],['#0ea5e9','fa-money-bill-transfer','মোট ডিপোজিট',tk(ok.reduce((a,d)=>a+d.amount,0))],['#db2777','fa-fire','আজকের অর্ডার',td.length],['#0d9488','fa-wallet','ইউজারদের মোট ব্যালেন্স',tk(S.users.reduce((a,u)=>a+(u.balance||0),0))],['#ea580c','fa-ticket','ওপেন টিকেট',S.tix.filter(t=>t.status=='open').length]];
  $('#v-dash').innerHTML=`<h2 class="t">ড্যাশবোর্ড<button class="btn s" id="lbB"><i class="fa-solid fa-trophy"></i> লিডারবোর্ড আপডেট</button></h2><div class="stats">${c.map(([bg,ic,l,v])=>`<div class="sc" style="background:${bg}"><small><i class="fa-solid ${ic}"></i> ${l}</small><b>${v}</b></div>`).join('')}</div>
  <div class="card"><h2 class="t" style="font-size:16px">সর্বশেষ অর্ডার</h2><div class="tw"><table><tr><th>ID</th><th>ইউজার</th><th>সার্ভিস</th><th>পরিমাণ</th><th>চার্জ</th><th>স্ট্যাটাস</th></tr>${[...S.orders].sort((a,b)=>ts(b)-ts(a)).slice(0,8).map(o=>`<tr><td>${o.orderNo}</td><td>${esc(o.userName)}</td><td>${esc(o.serviceName)}</td><td>${o.quantity}</td><td>${tk(o.charge)}</td><td><span class="st ${o.status}">${o.status}</span></td></tr>`).join('')||'<tr><td colspan=6 class="empty">কোনো অর্ডার নেই</td></tr>'}</table></div></div>`;
  $('#lbB').onclick=async()=>{const now=new Date(),m0=new Date(now.getFullYear(),now.getMonth(),1),mp={};
    S.orders.filter(o=>o.status!='canceled'&&o.createdAt?.toDate&&o.createdAt.toDate()>=m0).forEach(o=>{const x=mp[o.uid]=mp[o.uid]||{name:o.userName,spent:0,orders:0};x.spent+=o.charge;x.orders++});
    const rows=Object.values(mp).sort((a,b)=>b.spent-a.spent).slice(0,10).map(x=>({name:x.name,spent:+x.spent.toFixed(2),orders:x.orders}));
    try{await setDoc(doc(db,'settings','leaderboard'),{month:now.toLocaleString('en',{month:'long',year:'numeric'}),rows,updatedAt:serverTimestamp()});toast('লিডারবোর্ড আপডেট হয়েছে','ok')}catch(e){toast(e.message,'er')}};
}

/* REQUESTS */
function rReq(){
  const l=[...S.reqs].sort((a,b)=>ts(b)-ts(a));
  $('#v-reqs').innerHTML=`<h2 class="t">রিফান্ড / রিফিল রিকোয়েস্ট</h2><div class="card"><div class="tw"><table><tr><th>তারিখ</th><th>ইউজার</th><th>ধরন</th><th>অর্ডার</th><th>নোট</th><th>স্ট্যাটাস</th><th></th></tr>
  ${l.map(q=>`<tr><td>${fd(q.createdAt)}</td><td>${esc(q.userName)}</td><td>${q.type=='refund'?'💸 Refund':'🔁 Refill'}</td><td>#${esc(q.orderNo)} ${esc(q.serviceName)}</td><td>${esc(q.note)}</td><td><span class="st ${q.status=='pending'?'pending':q.status=='rejected'?'rejected':'done'}">${q.status}</span></td>
  <td>${q.status=='pending'?`<button class="btn g s" data-ra="${q._id}">${q.type=='refund'?'Refund দিন':'Done'}</button> <button class="btn r s" data-rr="${q._id}">Reject</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7 class="empty">কোনো রিকোয়েস্ট নেই</td></tr>'}</table></div></div>`;
  $$('[data-ra]').forEach(b=>b.onclick=()=>{const q=S.reqs.find(x=>x._id==b.dataset.ra);
    confirmDo(q.type=='refund'?'অর্ডার ক্যানসেল করে ইউজারকে টাকা ফেরত দেবেন?':'Refill করা হয়েছে হিসেবে চিহ্নিত করবেন?',async()=>{if(q.type=='refund')await setOrder(q.orderId,'canceled');await updateDoc(doc(db,'requests',q._id),{status:'done'})})});
  $$('[data-rr]').forEach(b=>b.onclick=()=>confirmDo('Reject করবেন?',()=>updateDoc(doc(db,'requests',b.dataset.rr),{status:'rejected'})));
}

async function setOrder(id,st){
  try{await runTransaction(db,async tx=>{

async function approve(id){
  const pct=+S.set.refPercent||0;
  await runTransaction(db,async tx=>{
    const r=doc(db,'deposits',id),d=(await tx.get(r)).data();
    if(!d||d.status!='pending')throw new Error('ইতিমধ্যে প্রসেস করা হয়েছে');
    const ur=doc(db,'users',d.uid),u=(await tx.get(ur)).data();
    let refDoc=null,bonus=0;
    if(u.referredBy&&pct>0){const m=S.users.find(x=>x.refCode==u.referredBy);if(m){refDoc=doc(db,'users',m._id);bonus=+(d.amount*pct/100).toFixed(2)}}
    tx.update(ur,{balance:increment(d.amount),totalDeposit:increment(d.amount)});
    if(refDoc)tx.update(refDoc,{balance:increment(bonus),refEarned:increment(bonus)});
    tx.update(r,{status:'approved',bonus});
  });
}

function rSet(){
  const s=S.set,m=s.methods||[];
  $('#v-set').innerHTML=`<h2 class="t">সাইট সেটিংস</h2><div class="card"><div class="fg"><div><label>সাইটের নাম</label><input id="s1" value="${esc(s.siteName||'')}"></div><div><label>সাপোর্ট লিংক (Telegram/WhatsApp)</label><input id="s2" value="${esc(s.supportLink||'')}"></div>
  <div><label>ন্যূনতম ডিপোজিট (৳)</label><input id="s3" type="number" value="${s.minDeposit||10}"></div><div><label>রেফার কমিশন (%)</label><input id="s4" type="number" step="0.1" value="${s.refPercent||0}"></div>
  <div><label>প্রতি অর্ডারে XP (ফিক্সড)</label><input id="x1" type="number" value="${s.xpPerOrder||0}"></div>
  <div><label>প্রতি ৳১ খরচে XP</label><input id="x2" type="number" step="0.1" value="${s.xpPerTaka||0}"></div>
  <div><label>কত XP = ৳১</label><input id="x3" type="number" value="${s.xpPerBdt||0}"></div>
  <div><label>ন্যূনতম XP কনভার্ট</label><input id="x4" type="number" value="${s.minXpConvert||0}"></div>
  <div><label>টিউটোরিয়াল ভিডিও লিংক</label><input id="x5" value="${esc(s.tutorialLink||'')}"></div>
  <div><label>টেলিগ্রাম মিনি অ্যাপ লিংক (যেমন https://t.me/YourBot/app)</label><input id="x6" value="${esc(s.botLink||'')}"></div></div>
  <h3 style="margin:18px 0 4px">🤖 বট সেটিংস</h3>
  <label>ফোর্স জয়েন চ্যানেল (প্রতি লাইনে একটি: @username অথবা প্রাইভেট হলে -100123...|https://t.me/+invite) — বটকে ওই চ্যানেলে অ্যাডমিন বানাতে হবে</label><textarea id="b1" rows="3">${esc((s.forceChannels||[]).join('\n'))}</textarea>
  <div class="fg"><div><label>অর্ডার চ্যানেল (@username বা -100...)</label><input id="b2" value="${esc(s.orderChannel||'')}"></div>
  <div><label>অর্ডার পোস্টের নিচের বাটন লিংক (খালি = বটের লিংক)</label><input id="b3" value="${esc(s.orderBtnLink||'')}"></div></div>
  <label>বট অ্যাডমিন টেলিগ্রাম আইডি (প্রতি লাইনে একটি, অতিরিক্ত)</label><textarea id="b4" rows="2">${esc((s.adminIds||[]).join('\n'))}</textarea>
  <label>নোটিশ (হোমে দেখাবে, খালি রাখলে লুকাবে)</label><textarea id="s5" rows="2">${esc(s.notice||'')}</textarea>
  <label>ব্যানার ইমেজ লিংক (প্রতি লাইনে একটি, খালি রাখলে ডিফল্ট)</label><textarea id="s6" rows="3">${esc((s.banners||[]).join('\n'))}</textarea>
  <label>ভিআইপি লেভেল (প্রতি লাইনে: নাম,ন্যূনতম খরচ,ডিসকাউন্ট%)</label><textarea id="s7" rows="5">${(s.levels||[{name:'Starter',min:0,disc:0},{name:'Bronze',min:500,disc:2},{name:'Silver',min:2000,disc:4},{name:'Gold',min:5000,disc:6},{name:'Diamond',min:15000,disc:10}]).map(l=>[l.name,l.min,l.disc].join(',')).join('\n')}</textarea>
  <label>সাপোর্ট বটের উত্তর (প্রতি লাইনে: কিওয়ার্ড১, কিওয়ার্ড২ => উত্তর)</label><textarea id="s8" rows="5" placeholder="যেমন: সময়, কতক্ষণ => অর্ডার সাধারণত ১ ঘণ্টার মধ্যে সম্পন্ন হয়।">${(s.faq||[]).map(f=>(f.k||[]).join(', ')+' => '+f.a).join('\n')}</textarea>
  <label>পেমেন্ট মেথড</label><div id="pmL">${m.map((x,i)=>pmRow(x)).join('')}</div>
  <button class="btn gr s" id="pmA" style="margin-top:10px"><i class="fa-solid fa-plus"></i> মেথড যোগ</button><br><button class="btn full" id="ss">সেভ করুন</button></div>
  <div class="card"><h2 class="t" style="font-size:17px">🔑 অ্যাডমিন পাসওয়ার্ড পরিবর্তন</h2><div class="fg"><div><label>বর্তমান পাসওয়ার্ড</label><input id="cp0" type="password"></div><div><label>নতুন পাসওয়ার্ড</label><input id="cp1" type="password"></div><div><label>নতুন পাসওয়ার্ড আবার</label><input id="cp2" type="password"></div></div><button class="btn" id="cpB" style="margin-top:14px">পাসওয়ার্ড বদলান</button></div>`;
  $('#cpB').onclick=async()=>{const a=$('#cp0').value,b=$('#cp1').value;if(b.length<6)return toast('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর','er');if(b!==$('#cp2').value)return toast('নতুন পাসওয়ার্ড দুইবার মেলেনি','er');
    try{const u=auth.currentUser;await reauthenticateWithCredential(u,EmailAuthProvider.credential(u.email,a));await updatePassword(u,b);$('#cp0').value=$('#cp1').value=$('#cp2').value='';toast('পাসওয়ার্ড বদলানো হয়েছে','ok')}catch{toast('বর্তমান পাসওয়ার্ড ভুল','er')}};
  $('#pmA').onclick=()=>$('#pmL').insertAdjacentHTML('beforeend',pmRow({}));
  $('#pmL').onclick=e=>{const b=e.target.closest('[data-rm]');if(b)b.parentElement.remove()};
  $('#ss').onclick=async()=>{
    const methods=$$('#pmL .pmr').map(r=>({name:r.children[0].value.trim(),number:r.children[1].value.trim(),note:r.children[2].value.trim()})).filter(x=>x.name&&x.number);
    try{await setDoc(doc(db,'settings','main'),{forceChannels:$('#b1').value.split('\n').map(x=>x.trim()).filter(Boolean),orderChannel:$('#b2').value.trim(),orderBtnLink:$('#b3').value.trim(),adminIds:$('#b4').value.split(/[\s,]+/).map(x=>x.trim()).filter(x=>/^\d+$/.test(x)),siteName:$('#s1').value.trim(),supportLink:$('#s2').value.trim(),minDeposit:+$('#s3').value||10,refPercent:+$('#s4').value||0,xpPerOrder:+$('#x1').value||0,xpPerTaka:+$('#x2').value||0,xpPerBdt:+$('#x3').value||0,minXpConvert:+$('#x4').value||0,tutorialLink:$('#x5').value.trim(),botLink:$('#x6').value.trim(),faq:$('#s8').value.split('\n').map(l=>l.split('=>')).filter(p=>p.length>=2&&p[0].trim()&&p[1].trim()).map(p=>({k:p[0].split(',').map(x=>x.trim()).filter(Boolean),a:p.slice(1).join('=>').trim()})),levels:$('#s7').value.split('\n').map(x=>x.split(',').map(y=>y.trim())).filter(a=>a[0]&&!isNaN(+a[1])).map(a=>({name:a[0],min:+a[1],disc:+a[2]||0})).sort((a,b)=>a.min-b.min),notice:$('#s5').value.trim(),banners:$('#s6').value.split('\n').map(x=>x.trim()).filter(Boolean),methods},{merge:true});toast('সেটিংস সেভ হয়েছে','ok')}catch(e){toast(e.message,'er')}};
}
const pmRow=x=>`<div class="pmr" style="display:flex;gap:8px;margin-top:8px"><input placeholder="নাম (bKash)" value="${esc(x.name||'')}"><input placeholder="নাম্বার" value="${esc(x.number||'')}"><input placeholder="নোট (Send Money)" value="${esc(x.note||'')}"><button class="btn r s" data-rm style="margin-top:5px"><i class="fa-solid fa-xmark"></i></button></div>`;
</script>
</body>
  </html>
